spring.application.name=config-server
server.port=8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Repositorio de GitHub con la configuracion de todos los servicios (un archivo por servicio).
# CONFIG_REPO_URI es opcional: sirve para apuntar a otra copia del repo (por ejemplo una carpeta local con git
# o un fork) sin tocar el codigo. Si es privado, agregar tambien spring.cloud.config.server.git.username/password
# (usuario y token de GitHub) como variables de entorno, nunca escritos aqui.
spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:https://github.com/Sophia-1827/DAW-II_Grupo09_gasmapocho_config-repo}
spring.cloud.config.server.git.default-label=main
